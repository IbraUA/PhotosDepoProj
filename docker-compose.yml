services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - images:/app/images
      - logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - images:/usr/share/nginx/html/images
      - ./static:/usr/share/nginx/html/static:ro
    restart: unless-stopped
volumes:
  images:
  logs:
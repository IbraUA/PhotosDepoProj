<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoDrop</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <section class="upload__intro">
        <h2 class="upload__title">Завантажені зображення</h2>
    </section>

    <div class="images-table-container">
        <table class="images-table">
            <thead>
                <tr>
                    <th>Файл</th>
                    <th>Оригінальна назва</th>
                    <th>Розмір (КБ)</th>
                    <th>Дата завантаження</th>
                    <th>Тип</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody>
                {{ROWS}}
            </tbody>
        </table>
    </div>

    <div class="images-pagination">
        {{PREV_LINK}}
        {{NEXT_LINK}}
    </div>
</body>
</html>
